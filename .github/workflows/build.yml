name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          else
            echo "::warning::KEYSTORE_B64 secret not set - using a temporary key. Updates will need a reinstall."
            keytool -genkeypair -keystore app/release.keystore -storetype PKCS12 -alias pcultimate -keyalg RSA -keysize 2048 -validity 10000 -storepass pcultimate -keypass pcultimate -dname "CN=PC Ultimate Controller"
          fi

      - name: Fonts
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL -o app/src/main/res/font/manrope.ttf "https://github.com/google/fonts/raw/main/ofl/manrope/Manrope%5Bwght%5D.ttf"
          curl -fsSL -o app/src/main/res/font/inter.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf"
          ls -la app/src/main/res/font

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Package
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/PC-Ultimate-Controller.apk
          sed -i "s/^VERSION = \"dev\"/VERSION = \"${{ github.run_number }}\"/" pc/server.py
          cd pc && zip -r ../out/PC-Server.zip . -x "test_*" && cd ..

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: out/*
