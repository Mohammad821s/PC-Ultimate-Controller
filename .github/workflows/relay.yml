name: Deploy relay
on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Mohammad821s' }}
    env:
      TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Deploy
        if: ${{ env.HAS_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: TURN key (optional)
        if: ${{ env.HAS_TOKEN == 'true' && env.TURN_KEY_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURN_KEY_TOKEN: ${{ secrets.TURN_KEY_TOKEN }}
        run: |
          printf '%s' "$TURN_KEY_ID" | npx wrangler secret put TURN_KEY_ID
          printf '%s' "$TURN_KEY_TOKEN" | npx wrangler secret put TURN_KEY_TOKEN
