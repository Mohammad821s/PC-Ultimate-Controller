name: Firmware
on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7
          arduino-cli lib install "WiFiManager@2.0.17" "WebSockets@2.6.1" "ArduinoJson@7.2.1"
      - name: Compile
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --export-binaries --output-dir out firmware/pc-waker
          ls -la out
          cp out/pc-waker.ino.merged.bin pc-waker.bin
      # The relay serves the flasher page at /flash and passes this file through.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view waker-fw >/dev/null 2>&1 || gh release create waker-fw --title "PC Waker firmware" --notes "ESP32 firmware for turning the PC on. Install it from the relay's /flash page."
          gh release upload waker-fw pc-waker.bin --clobber
